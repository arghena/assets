[match]
dot = true

[formatters]
prettier = ["**/*.yml", "**/*.md"]
tombi = ["**/*.toml"]

[linters]
typos = ["**/*", "!**/*.png", "!**/*.gif"]
yamllint = ["**/*.yml"]
actionlint = [".github/workflows/*.yml"]
zizmor = [".github/workflows/*.yml", ".github/dependabot.yml"]
markdownlint-cli2 = ["**/*.md"]
tombi = ["**/*.toml"]

[args.linters]
yamllint = ["--strict"]
tombi = ["--error-on-warnings"]
